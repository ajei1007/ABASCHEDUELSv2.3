name: Production ECS | ABA Schedules

on:
  push:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          # Build the Docker image
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG -f ecs/Dockerfile.backend .
          # Tag the image
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # Push the image to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/production-node.json # Task definition json file for this env
          container-name: production-abaschedules-fullstack
          image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:prod-${{ github.sha }}
          environment-variables: |
            NODE_ENV=production
            APP_ENV=production
            PORT=8080
            MOBILE_APP_ENABLED=true
            REDIS_URL=${{ vars.REDIS_URL }}
            ENABLE_MONITORING=true
            ATATUS_PROJECT_NAME=${{ vars.ATATUS_PROJECT_NAME }}
            ATATUS_API_KEY=${{ vars.ATATUS_API_KEY }}
            ATATUS_ENABLE_PROBABILITY=${{ vars.ATATUS_ENABLE_PROBABILITY }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            SUPER_ADMIN_PASS=${{ vars.SUPER_ADMIN_PASS }}
            SWAGGER_URL=https://jbk.abaschedules.com
            JIRA_DOMAIN=${{ vars.JIRA_DOMAIN }}
            JIRA_EMAIL=${{ vars.JIRA_EMAIL }}
            JIRA_API_TOKEN=${{ vars.JIRA_API_TOKEN }}
            JIRA_PROJECT_KEY=${{ vars.JIRA_PROJECT_KEY }}
            SLACK_ADMIN_TASKS_WEBHOOK_URL=${{ vars.SLACK_ADMIN_TASKS_WEBHOOK_URL }}
            SLACK_BUGS_WEBHOOK_URL=${{ vars.SLACK_BUGS_WEBHOOK_URL }}
            SLACK_FEATURE_REQUESTS_WEBHOOK_URL=${{ vars.SLACK_FEATURE_REQUESTS_WEBHOOK_URL }}

            REDIS_DISABLED=false

            JBK_DB_USER=${{ vars.JBK_DB_USER }}
            JBK_DB_PASS=${{ vars.JBK_DB_PASS }}
            JBK_DB_NAME=${{ vars.JBK_DB_NAME }}
            JBK_DB_HOST_READ=${{ vars.JBK_DB_HOST_READ }}
            JBK_DB_HOST_WRITE=${{ vars.JBK_DB_HOST_WRITE }}
            JBK_DB_PORT=${{ vars.JBK_DB_PORT }}

            GOOGLE_MAPS_API_KEY=${{ vars.GOOGLE_MAPS_API_KEY }}

            GOOGLE_DISTANCEMATRIX_API_KEY=${{ vars.GOOGLE_DISTANCEMATRIX_API_KEY }}

            PEDSPLUS_DB_USER=${{ vars.PEDSPLUS_DB_USER }}
            PEDSPLUS_DB_PASS=${{ vars.PEDSPLUS_DB_PASS }}
            PEDSPLUS_DB_NAME=${{ vars.PEDSPLUS_DB_NAME }}
            PEDSPLUS_DB_HOST_READ=${{ vars.PEDSPLUS_DB_HOST_READ }}
            PEDSPLUS_DB_HOST_WRITE=${{ vars.PEDSPLUS_DB_HOST_WRITE }}
            PEDSPLUS_DB_PORT=${{ vars.PEDSPLUS_DB_PORT }}

            APP_DB_USER=${{ vars.APP_DB_USER }}
            APP_DB_PASS=${{ vars.APP_DB_PASS }}
            APP_DB_NAME=${{ vars.APP_DB_NAME }}
            APP_DB_HOST_READ=${{ vars.APP_DB_HOST_READ }}
            APP_DB_HOST_WRITE=${{ vars.APP_DB_HOST_WRITE }}
            APP_DB_PORT=${{ vars.APP_DB_PORT }}

            ABC_DB_USER=${{ vars.ABC_DB_USER }}
            ABC_DB_PASS=${{ vars.ABC_DB_PASS }}
            ABC_DB_NAME=${{ vars.ABC_DB_NAME }}
            ABC_DB_HOST_READ=${{ vars.ABC_DB_HOST_READ }}
            ABC_DB_HOST_WRITE=${{ vars.ABC_DB_HOST_WRITE }}
            ABC_DB_PORT=${{ vars.ABC_DB_PORT }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.SERVICE_NAME }}
          cluster: ${{ vars.CLUSTER_NAME }}
          wait-for-service-stability: true
  frontend:
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    environment:
      name: production
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: USE NODE.JS ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: "./frontend/yarn.lock"
          cache: "yarn"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: yarn install

      - name: Build frontends
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TSC_COMPILE_ON_ERROR: true
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: yarn build:jbk && yarn build:pedsplus && yarn build:abc && yarn build:app

      - name: Deploy to PEDSPLUS S3 and Invalidate Cache
        run: |
          aws s3 sync builds/pedsplus s3://pedsplus-react-app --delete
          aws cloudfront create-invalidation --distribution-id EG7NMHA9O8DNG --paths "/*"
      - name: Deploy to JBK S3 and Invalidate Cache
        run: |
          aws s3 sync builds/jbk s3://jbk-react-app --delete
          aws cloudfront create-invalidation --distribution-id EDZCH5HM226T0 --paths "/*"
      - name: Deploy to ABC S3 and Invalidate Cache
        run: |
          aws s3 sync builds/abc s3://abc-react-app --delete
          aws cloudfront create-invalidation --distribution-id E3CQV1LNRQC3DU --paths "/*"
      - name: Deploy to APP S3 and Invalidate Cache
        run: |
          aws s3 sync builds/app s3://app-react-app --delete
          aws cloudfront create-invalidation --distribution-id EE3LZ85LLWXYT --paths "/*"
  jira-sync:
    needs: [frontend, backend]
    uses: ./.github/workflows/jira_deploy.yml
    with:
      environment: "production"
      deployment_name: "Production ECS"
      description: "Deployment to the Production environment for QA."
      url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
