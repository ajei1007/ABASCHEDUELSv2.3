          description: User ID to check constraint for
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: constraintId
          schema:
            type: string
            format: uuid
          description: Constraint ID to check
        - in: query
          name: date
          schema:
            type: string
            format: date
          description: Date to check constraint for
      responses:
        200:
          description: Time constraint check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeConstraintUserRelations'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'

