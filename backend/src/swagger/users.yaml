  /api/users/check-unmatchingconstraint/{id}:
    get:
      security:
        - bearerAuth: []
      tags: [Users]
      summary: Check unmatching constraint for user
      description: Check a specific unmatching constraint for a user
      parameters:
        - in: path
          name: id
          description: User ID to check constraint for
