        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ServerError'

  /api/users/constraint-gap/flags:
    post:
      security:
        - bearerAuth: []
      tags: [Users]
      summary: Get constraint gap flags
      description: Get constraint gap flags for users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstraintGapFlagRequest'
      responses:
        200:
          description: Constraint gap flags successfully received
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConstraintGapFlags'
        400:
          $ref: '#/components/responses/ValidationError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/ServerError'