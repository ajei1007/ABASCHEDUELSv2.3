          description: User-to-user constraint check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserToUserFrequencyConstraintUserRelations'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
